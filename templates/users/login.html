{% extends "base.html" %}
{% block title %}Login — NagarikSetu{% endblock %}

{% block content %}
<div class="row justify-content-center">
<div class="col-md-4">
  <h3 class="mb-4">🔐 Login</h3>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success w-100 mt-2">Login</button>
  </form>
  <p class="mt-3 text-center">
    No account? <a href="{% url 'signup' %}">Sign up</a>
  </p>
</div>
</div>
{% endblock %}
