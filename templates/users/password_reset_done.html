{% extends "base.html" %}
{% load complaint_extras %}
{% block title %}Check your email — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card"><div class="empty">
    <div class="empty-icon">{% icon 'mail' %}</div>
    <h1>Check your email</h1>
    <p>If an account uses that address, a password reset link is on its way. It can be used once.</p>
    <a class="btn secondary" href="{% url 'login' %}">Back to sign in</a>
  </div></div>
</div>
{% endblock %}
