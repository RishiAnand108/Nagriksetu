{% extends "base.html" %}
{% load complaint_extras %}
{% block title %}Password updated — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card"><div class="empty">
    <div class="empty-icon">{% icon 'check-circle' %}</div>
    <h1>Password updated</h1>

    <a class="btn" href="{% url 'login' %}">Sign in</a>
  </div></div>
</div>
{% endblock %}
