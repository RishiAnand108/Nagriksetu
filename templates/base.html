<!-- templates/base.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NagarikSetu{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-dark bg-success px-4">
    <a class="navbar-brand fw-bold" href="/">🏛 NagarikSetu</a>
    <div class="d-flex align-items-center gap-2">
      {% if user.is_authenticated %}
        {% if user.role == 'corporator' %}
          <a href="{% url 'corporator-dashboard' %}"
             class="btn btn-outline-light btn-sm">📊 Dashboard</a>
        {% endif %}
        <span class="text-white">👤 {{ user.username }}</span>
        <a href="{% url 'logout' %}"
           class="btn btn-outline-light btn-sm">Logout</a>
      {% else %}
        <a href="{% url 'login' %}"
           class="btn btn-light btn-sm">Login</a>
      {% endif %}
    </div>
  </nav>

  <div class="container mt-4">
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
