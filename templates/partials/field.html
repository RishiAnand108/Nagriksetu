{% load complaint_extras %}<div class="field{% if field.errors %} has-error{% endif %}">
  <label class="field-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="req" aria-hidden="true">*</span>{% else %}<span class="opt">(optional)</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<div class="field-help">{{ field.help_text|safe }}</div>{% endif %}
  {% for error in field.errors %}<div class="field-error" role="alert">{% icon 'alert' %}<span>{{ error }}</span></div>{% endfor %}
</div>
