{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong — NagrikSetu</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <main class="main"><div class="container">
    <div class="error-page">
      <div class="error-code">500</div>
      <h1>Something went wrong on our side</h1>
      <p class="muted">The error has been logged{% if request_id %} with reference <code>{{ request_id }}</code>{% endif %}.
        Please try again in a moment — your report has not been lost if it was already submitted.</p>
      <a class="btn" href="/">Back to NagrikSetu</a>
    </div>
  </div></main>
</body>
</html>
